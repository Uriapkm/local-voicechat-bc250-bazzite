# ==========================================
# CONFIGURACIÓN DEL SISTEMA AI (BAZZITE/DISTROBOX)
# ==========================================
# Edita este archivo antes de ejecutar install.sh
# O usa ./run.sh para configuración automática

[CONTAINER]
# Nombre del contenedor Distrobox
name = ai-assistant-box
# Imagen base (usa una compatible con tu hardware, ej: fedora, ubuntu, arch)
image = docker.io/library/fedora:latest
# Ruta donde se montará el proyecto dentro del contenedor
mount_path = /home/user/ai-project

[PYTHON]
# Versión de Python a instalar en el contenedor
version = 3.11
# Ruta del entorno virtual dentro del contenedor
venv_path = /home/user/ai-project/venv

[OLLAMA]
# Instalar Ollama automáticamente? (true/false)
install_ollama = true
# Modelos a descargar automáticamente (separados por espacios)
# Modelo base recomendado para BC250/handhelds:
models = fredrezones55/Gemma-4-Uncensored-HauhauCS-Aggressive:e4b

[APP]
# Comando para iniciar tu aplicación Python una vez activo el venv
# Ejemplo: python main.py o streamlit run app.py
start_command = python app.py
# Puerto(s) a exponer si tu app es web (ej: 8501:8501)
ports = 
